[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hertzon"
version = "0.1.4"
description = "3D full-wave FEM simulator with an adaptive-meshing workflow, built on EMerge"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"
dependencies = [
    "emerge==2.8.9",
    "PySide6>=6.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "matplotlib>=3.7",
    "numpy",
    "pymmg>=1.0",                 # mmg3d (LGPL) for the "Mmg" adaptive refinement
    "fast-simplification>=0.1",   # MIT, shape-preserving STL simplification on import
    "hfsynpy>=0.1.4",             # GPL-2.0+, microstrip synthesis of the filter and antenna design tools
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hertzon = "hertzon.gui.app:main"
hertzon-mcp = "hertzon.mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["hertzon*"]

[tool.setuptools.package-data]
"hertzon.gui" = ["*.ico", "*.png", "*.jpg"]
